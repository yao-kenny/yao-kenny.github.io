<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kenny Yao 的个人学习笔记与文章。" />
    <script>try{document.documentElement.dataset.theme=localStorage.getItem('kenny-theme')||'light'}catch(error){}</script>
    <title>Kenny's Notes</title>
    <link rel="stylesheet" href="styles.css?v=8" />
  </head>
  <body>
    <div class="site-wrap">
      <header class="site-header" aria-label="主导航">
        <a class="brand" href="#top">Kenny's Notes</a>
        <div class="header-actions"><button class="icon-button" id="theme-toggle" aria-label="切换深色模式" title="切换深色模式"><span aria-hidden="true">Theme</span></button><span class="divider" aria-hidden="true">|</span><nav class="top-nav" aria-label="页面导航"><a class="top-nav-link is-current" href="#writing">Posts</a></nav></div>
      </header>

      <main id="top">
        <section class="welcome" aria-labelledby="welcome-title"><h1 id="welcome-title">👋 Welcome to Kenny's Notes</h1></section>

        <section class="posts-section" id="writing" aria-labelledby="posts-title"><div class="posts-heading"><h2 id="posts-title">Recent posts</h2><label class="search-box"><input id="search-input" type="search" aria-label="搜索文章" placeholder="Search posts" autocomplete="off" /><kbd>/</kbd></label></div><div class="filter-row" id="tag-filters" aria-label="按主题筛选"></div><div class="article-grid" id="article-grid"></div><p class="empty-state" id="empty-state" role="status" aria-live="polite" hidden>No posts match your search.</p><button class="retry-button" id="retry-load" type="button" hidden>重试</button></section>
      </main>

      <footer class="site-footer"><span>© 2026 Kenny Yao</span><span>Powered by GitHub Pages</span></footer>
    </div>

    <script src="script.js?v=5"></script>
  </body>
</html>
