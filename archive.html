<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kenny Yao 的文章归档。" />
    <script>try{document.documentElement.dataset.theme=localStorage.getItem('kenny-theme')||'light'}catch(error){}</script>
    <title>Archive · Kenny's Notes</title>
    <link rel="stylesheet" href="styles.css?v=8" />
  </head>
  <body>
    <div class="site-wrap">
      <header class="site-header" aria-label="主导航">
        <a class="brand" href="index.html#top">Kenny's Notes</a>
        <div class="header-actions"><button class="icon-button" id="theme-toggle" aria-label="切换深色模式" title="切换深色模式"><span aria-hidden="true">Theme</span></button><span class="divider" aria-hidden="true">|</span><nav class="top-nav" aria-label="页面导航"><a class="top-nav-link" href="index.html#writing">Posts</a></nav></div>
      </header>
      <main class="archive-page" id="top">
        <a class="post-back" href="index.html#writing">← 返回文章列表</a>
        <header class="page-heading"><p class="eyebrow">Archive</p><h1>文章归档</h1><p>按年份浏览全部文章。</p></header>
        <div id="archive-list" class="archive-list" aria-live="polite"><p class="post-state">Loading archive…</p></div>
        <button class="retry-button" id="retry-load" type="button" hidden>重试</button>
      </main>
      <footer class="site-footer"><span>© 2026 Kenny Yao</span><span>Powered by GitHub Pages</span></footer>
    </div>
    <script src="archive.js?v=1"></script>
  </body>
</html>
